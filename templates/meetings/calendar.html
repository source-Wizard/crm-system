{% extends 'base.html' %}
{% block title %}Meeting Calendar{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0"><i class="fa-regular fa-calendar text-primary me-2"></i>Meeting Calendar</h4>
    <a href="/meetings/" class="btn btn-outline-secondary"><i class="fa-solid fa-list me-1"></i>List View</a>
</div>
<div class="card"><div class="card-body">
    <div id="calendar"></div>
</div></div>

<!-- Event popover modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="evTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="evBody"></div>
            <div class="modal-footer">
                <a href="#" id="evEditLink" class="btn btn-warning btn-sm"><i class="fa-solid fa-pen me-1"></i>Edit</a>
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const statusColors = { Scheduled: '#0dcaf0', Completed: '#198754', Cancelled: '#dc3545' };

document.addEventListener('DOMContentLoaded', function () {
    const cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth',
        height: 650,
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listWeek' },
        events: '/calendar/events/',
        eventClick: function (info) {
            const p = info.event.extendedProps;
            $('#evTitle').text(info.event.title);
            $('#evBody').html(`
                <table class="table table-sm small mb-0">
                    <tr><td class="text-muted">Type</td><td>${p.type || '—'}</td></tr>
                    <tr><td class="text-muted">Status</td><td>${p.status || '—'}</td></tr>
                    <tr><td class="text-muted">Start</td><td>${fmt(info.event.start)}</td></tr>
                    <tr><td class="text-muted">End</td><td>${fmt(info.event.end)}</td></tr>
                    <tr><td class="text-muted">Customer</td><td>${p.customer || '—'}</td></tr>
                </table>`);
            $('#evEditLink').attr('href', '/meetings/');
            new bootstrap.Modal('#eventModal').show();
        }
    });
    cal.render();
});

function fmt(d) {
    if (!d) return '—';
    return d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
}
</script>
{% endblock %}
