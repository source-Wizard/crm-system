{% extends 'auth/base_auth.html' %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<div class="card auth-card p-1">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="fa-solid fa-key text-primary me-2"></i>Forgot Password</h4>
        <p class="text-muted small">Enter your account email and we will send you a reset link.</p>
        <form id="forgotForm">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="you@company.com" required>
                </div>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Send Reset Link</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login/" class="small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Back to login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$('#forgotForm').on('submit', function (e) {
    e.preventDefault();
    $.post('/forgot-password/', $(this).serialize())
        .done(function (res) {
            Swal.fire('Check your email', res.message, 'success').then(() => window.location = '/login/');
        })
        .fail(function (xhr) {
            Swal.fire('Not found', (xhr.responseJSON || {}).message || 'Error', 'error');
        });
});
</script>
{% endblock %}
