{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login{% endblock %} | TechNova CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-page">
    {% block auth_content %}{% endblock %}
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function getCookie(name) {
    let v = null;
    document.cookie.split(';').forEach(c => {
        const p = c.trim();
        if (p.startsWith(name + '=')) v = decodeURIComponent(p.slice(name.length + 1));
    });
    return v;
}
$.ajaxSetup({
    beforeSend: function (xhr) { xhr.setRequestHeader("X-CSRFToken", getCookie('csrftoken')); }
});
function toast(title, icon = 'success') {
    Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
                timerProgressBar: true, icon: icon, title: title });
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
