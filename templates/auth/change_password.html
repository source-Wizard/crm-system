{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-key text-primary me-2"></i>Change Password</div>
            <div class="card-body">
                <form id="changePassForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" minlength="6" required>
                        <small class="text-muted">Minimum 6 characters</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="6" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$('#changePassForm').on('submit', function (e) {
    e.preventDefault();
    $.post('/change-password/', $(this).serialize())
        .done(function (res) { Swal.fire('Success', res.message, 'success'); $('#changePassForm')[0].reset(); })
        .fail(function (xhr) { handleAjaxError(xhr); });
});
</script>
{% endblock %}
