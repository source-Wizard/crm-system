{% extends 'auth/base_auth.html' %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<div class="card auth-card p-1">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="fa-solid fa-lock-open text-primary me-2"></i>Reset Password</h4>
        <p class="text-muted small">Choose a strong new password for your account.</p>
        <form id="resetForm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" minlength="6" required>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$('#resetForm').on('submit', function (e) {
    e.preventDefault();
    $.post(window.location.pathname, $(this).serialize())
        .done(function (res) {
            Swal.fire('Success', res.message, 'success').then(() => window.location = res.redirect);
        })
        .fail(function (xhr) {
            Swal.fire('Error', (xhr.responseJSON || {}).message || 'Error', 'error');
        });
});
</script>
{% endblock %}
