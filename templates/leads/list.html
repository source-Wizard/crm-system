{% extends 'base.html' %}
{% block title %}Leads{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div>
        <h4 class="fw-bold mb-0"><i class="fa-solid fa-filter-circle-dollar text-primary me-2"></i>Leads</h4>
        <small class="text-muted">Track and convert your sales leads</small>
    </div>
    <button class="btn btn-primary" onclick="openLeadModal()"><i class="fa-solid fa-plus me-1"></i>New Lead</button>
</div>

<div class="card">
    <div class="card-header d-flex gap-2 flex-wrap">
        <select id="fStatus" class="form-select form-select-sm w-auto"><option value="">All Statuses</option>
            {% for s in statuses %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select>
        <select id="fSource" class="form-select form-select-sm w-auto"><option value="">All Sources</option>
            {% for s in sources %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select>
        <select id="fPriority" class="form-select form-select-sm w-auto"><option value="">All Priorities</option>
            {% for p in priorities %}<option>{{ p }}</option>{% endfor %}</select>
        <select id="fAssigned" class="form-select form-select-sm w-auto"><option value="">Anyone</option>
            {% for u in users %}<option value="{{ u.id }}">{{ u.get_full_name }}</option>{% endfor %}</select>
    </div>
    <div class="card-body">
<table id="leadsTable" class="table table-hover w-100">
    <thead><tr><th>ID</th><th>Name</th><th>Company</th><th>Email</th><th>Source</th><th>Status</th>
        <th>Priority</th><th>Expected Revenue</th><th>Assigned To</th><th class="no-export">Actions</th></tr></thead>
</table>
    </div>
</div>

<div class="modal fade" id="leadModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="leadForm" novalidate>
                <input type="hidden" name="id" id="l_id">
                <div class="modal-header"><h5 class="modal-title" id="leadModalTitle">New Lead</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body row g-3">
                    <div class="col-md-6"><label class="form-label">First Name *</label><input name="first_name" class="form-control" required></div>
                    <div class="col-md-6"><label class="form-label">Last Name *</label><input name="last_name" class="form-control" required></div>
                    <div class="col-md-6"><label class="form-label">Company</label><input name="company" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">Website</label><input name="website" class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">Source</label>
                        <select name="source_id" class="form-select"><option value="">--</option>
                            {% for s in sources %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
                    <div class="col-md-4"><label class="form-label">Status</label>
                        <select name="status_id" class="form-select"><option value="">--</option>
                            {% for s in statuses %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
                    <div class="col-md-4"><label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            {% for p in priorities %}<option {% if p == 'Medium' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
                    <div class="col-md-6"><label class="form-label">Expected Revenue ($)</label>
                        <input name="expected_revenue" type="number" step="0.01" min="0" class="form-control" value="0"></div>
                    <div class="col-md-6"><label class="form-label">Assigned To</label>
                        <select name="assigned_to" class="form-select"><option value="">-- Unassigned --</option>
                            {% for u in users %}<option value="{{ u.id }}">{{ u.get_full_name }}</option>{% endfor %}</select></div>
                    <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" rows="2" class="form-control"></textarea></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary px-4"><i class="fa-solid fa-floppy-disk me-1"></i>Save Lead</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let leadTable;

$(function () {
    leadTable = initDataTable('#leadsTable', '/leads/data/', [
        { data: 'id' },
        { data: 'name', render: (d, t, r) => r.converted
            ? `${d} <span class="badge badge-soft-success" title="Converted">C</span>`
            : `<a href="/leads/${r.id}/" class="text-decoration-none fw-semibold">${d}</a>` },
        { data: 'company' }, { data: 'email' },
        { data: 'source' },
        { data: 'status', render: (d, t, r) => `<span class="badge" style="background:${r.status_color}22;color:${r.status_color}">${d}</span>` },
        { data: 'priority', render: (d, t, r) => `<span class="badge badge-soft-${r.priority_class}">${d}</span>` },
        { data: 'expected_revenue', render: d => '$' + d },
        { data: 'assigned_to' },
        { data: null, className: 'no-export', orderable: false, searchable: false, render: (d, t, r) => `
            <a href="/leads/${r.id}/" class="btn btn-sm btn-outline-primary" title="Detail"><i class="fa-solid fa-eye"></i></a>
            ${r.converted ? '' : `<button class="btn btn-sm btn-outline-success" title="Convert to customer" onclick="convertLead(${r.id})"><i class="fa-solid fa-right-left"></i></button>`}
            <button class="btn btn-sm btn-outline-warning" onclick='editLead(${JSON.stringify(JSON.stringify(r))})'><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteLead(${r.id})"><i class="fa-solid fa-trash"></i></button>` }
    ], {
        orderCol: 0,
        filters: d => {
            d.status_id = $('#fStatus').val() || '';
            d.source_id = $('#fSource').val() || '';
            d.priority = $('#fPriority').val() || '';
            d.assigned_to = $('#fAssigned').val() || '';
        }
    });

    $('#fStatus,#fSource,#fPriority,#fAssigned').on('change', () => leadTable.ajax.reload());
});

function openLeadModal() {
    $('#leadForm')[0].reset();
    $('#l_id').val('');
    $('#leadModalTitle').text('New Lead');
    new bootstrap.Modal('#leadModal').show();
}

function editLead(json) {
    const r = JSON.parse(json);
    $.get(`/leads/${r.id}/get/`).done(res => {
        const l = res.lead;
        const f = $('#leadForm')[0];
        f.reset();
        for (const [k, v] of Object.entries(l)) if (f.elements[k]) f.elements[k].value = v ?? '';
        $('#leadModalTitle').text('Edit Lead');
        new bootstrap.Modal('#leadModal').show();
    });
}

$('#leadForm').on('submit', function (e) {
    e.preventDefault();
    $.post('/leads/save/', $(this).serialize()).done(res => {
        toast(res.message);
        bootstrap.Modal.getInstance('#leadModal').hide();
        leadTable.ajax.reload(null, false);
    }).fail(handleAjaxError);
});

function deleteLead(id) {
    confirmDelete(`/leads/${id}/delete/`, () => leadTable.ajax.reload(null, false));
}

function convertLead(id) {
    Swal.fire({ title: 'Convert to Customer?', text: 'A customer record will be created from this lead.',
                icon: 'question', showCancelButton: true, confirmButtonText: 'Convert' })
        .then(r => { if (r.isConfirmed)
            $.post(`/leads/${id}/convert/`).done(res =>
                Swal.fire('Converted!', res.message, 'success').then(() => location.reload()))
            .fail(handleAjaxError); });
}
</script>
{% endblock %}
