{% extends 'base.html' %}
{% block title %}Customer Trash{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <a href="/customers/" class="small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Back to Customers</a>
        <h4 class="fw-bold mb-0 mt-1"><i class="fa-solid fa-trash-can text-danger me-2"></i>Trash</h4>
    </div>
</div>
<div class="card"><div class="card-body">
<table id="trashTable" class="table table-hover w-100">
    <thead><tr><th>ID</th><th>Code</th><th>Company</th><th>Email</th><th>Deleted On</th><th class="no-export">Actions</th></tr></thead>
</table>
</div></div>
{% endblock %}

{% block scripts %}
<script>
let trashTable;
$(function () {
    trashTable = initDataTable('#trashTable', '/customers/trash/data/', [
        { data: 'customer_code' }, { data: 'customer_code', visible: false },
        { data: 'company_name' }, { data: 'email' }, { data: 'deleted' },
        { data: null, className: 'no-export', orderable: false, render: (d, t, r) =>
            `<button class="btn btn-sm btn-outline-success" onclick="restore(${r.id})"><i class="fa-solid fa-rotate-left me-1"></i>Restore</button>
             <button class="btn btn-sm btn-outline-danger" onclick="forceDelete(${r.id})"><i class="fa-solid fa-xmark"></i></button>` }
    ], { orderCol: 0 });
});
function restore(id) {
    $.post(`/customers/${id}/restore/`).done(res => { toast(res.message); trashTable.ajax.reload(null, false); });
}
function forceDelete(id) {
    confirmDelete(`/customers/${id}/force-delete/`, () => trashTable.ajax.reload(null, false),
                  'Permanently delete this customer and all related data?');
}
</script>
{% endblock %}
